# MinIO: S3 API на хосте — http://localhost:9020, консоль — http://localhost:9001
# Полный перезапуск: docker compose down && docker compose up -d --force-recreate
# С удалением данных MinIO: docker compose down -v && docker compose up -d

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: cms-workflow-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # S3 API: внутри контейнера 9000 → на ПК 9020 (9000 на хосте часто занят Kafka)
      - '9020:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  minio_data:
