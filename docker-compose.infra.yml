# PostgreSQL и Kafka для локальной разработки (отдельно от сервиса)
#
# Запуск:
#   docker compose -f docker-compose.infra.yml up -d
#
# Остановка с удалением данных:
#   docker compose -f docker-compose.infra.yml down -v
#
# Подключение с хоста (npm run start:dev): localhost:5432, localhost:9092
# Подключение из docker-compose.yml сервиса: host.docker.internal

name: cms-workflow-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cms_workflow}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: bitnami/kafka:3.9
    container_name: cms-workflow-kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_HOST_PORT:-9092}:9092'
    environment:
      ALLOW_PLAINTEXT_LISTENER: 'yes'
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: 'controller,broker'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_CFG_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: bitnami/kafka:3.9
    container_name: cms-workflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_INCIDENT_TOPIC: ${KAFKA_INCIDENT_TOPIC:-cms.incident.events}
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic "$${KAFKA_INCIDENT_TOPIC}" \
          --partitions 1 \
          --replication-factor 1
        echo "Kafka topic ready: $${KAFKA_INCIDENT_TOPIC}"
    restart: 'no'

volumes:
  postgres_data:
